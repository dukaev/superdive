version: 2

release:
  # If set to auto, will mark the release as not ready for production in case there is an indicator for this in the
  # tag e.g. v1.0.0-rc1 .If set to true, will mark the release as not ready for production.
  prerelease: auto

  # If set to true, will not auto-publish the release. This is done to allow us to review the changelog before publishing.
  draft: false

env:
  # required to support multi architecture docker builds
  - DOCKER_CLI_EXPERIMENTAL=enabled
  - CGO_ENABLED=0

builds:
  - id: superdive
    binary: superdive
    dir: ./cmd/dive
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      -w
      -s
      -extldflags '-static'
      -X main.version={{.Version}}
      -X main.gitCommit={{.Commit}}
      -X main.buildDate={{.Date}}
      -X main.gitDescription={{.Summary}}

archives:
  - id: superdive-archives
    builds:
      - superdive
    name_template: "superdive_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

nfpms:
  - license: MIT
    maintainer: Aslan Dukaev
    homepage: "https://github.com/dukaev/superdive"
    description: "A tool for exploring layers in a docker image"
    formats:
      - rpm
      - deb

dockers:
  - &docker_amd64
    id: docker-amd64
    ids:
      - superdive
    use: buildx
    goarch: amd64
    image_templates:
      - ghcr.io/dukaev/superdive:latest
      - ghcr.io/dukaev/superdive:v{{.Version}}-amd64
    build_flag_templates:
      - "--build-arg=DOCKER_CLI_VERSION={{.Env.DOCKER_CLI_VERSION}}"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.description=A tool for exploring layers in a docker image"
      - "--label=org.opencontainers.image.url={{.GitURL}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.licenses=MIT"

  - &docker_arm64
    id: docker-arm64
    ids:
      - superdive
    use: buildx
    goarch: arm64
    image_templates:
      - ghcr.io/dukaev/superdive:v{{.Version}}-arm64
    build_flag_templates:
      - "--build-arg=DOCKER_CLI_VERSION={{.Env.DOCKER_CLI_VERSION}}"
      - "--platform=linux/arm64/v8"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.description=A tool for exploring layers in a docker image"
      - "--label=org.opencontainers.image.url={{.GitURL}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: ghcr.io/dukaev/superdive:latest
    image_templates:
      - ghcr.io/dukaev/superdive:v{{.Version}}-amd64
      - ghcr.io/dukaev/superdive:v{{.Version}}-arm64

  - name_template: ghcr.io/dukaev/superdive:v{{.Version}}
    image_templates:
      - ghcr.io/dukaev/superdive:v{{.Version}}-amd64
      - ghcr.io/dukaev/superdive:v{{.Version}}-arm64
