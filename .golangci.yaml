version: "2"

linters:
  disable-all: true
  enable:
    # --- 1. Critical Bugs & Correctness (Must Have) ---
    - govet
    - errcheck
    - staticcheck  # includes gosimple
    - bodyclose
    - nilerr        # [SENIOR] Returning nil when there is an error
    - noctx         # [SENIOR] HTTP requests without context (cause of memory leaks)
    - gosec         # [SENIOR] Basic security

    # --- 2. Clean Code & Dead Code ---
    - unused
    - ineffassign
    - unconvert     # [SENIOR] Removes unnecessary type conversions (int(x))
    - prealloc      # [SENIOR] Slice allocation optimization

    # --- 3. Style ---
    - misspell
    - revive        # [SENIOR] Replacement for golint. Idiomatic Go.

    # --- 4. Complexity & Architecture ---
    - gocyclo
    - gocognit
    - funlen
    - nestif
    - goconst

    # --- 5. Linter Hygiene (Meta-Linting) ---
    - nolintlint    # [SENIOR] Forces cleanup of old //nolint comments

    # --- 6. The "Opinionated" Reviewer ---
    - gocritic      # [SENIOR] Finds non-obvious bugs and style issues

linters-settings:
  # Complexity settings (keeping your soft settings for legacy)
  funlen:
    lines: 110
    statements: 60

  gocyclo:
    min-complexity: 35

  gocognit:
    min-complexity: 30

  nestif:
    min-complexity: 5

  goconst:
    min-len: 3
    min-occurrences: 3

  # [SENIOR SETTINGS]
  revive:
    rules:
      - name: exported
        disabled: true # Disable requirement for comments on all exported items (often noisy for UI)
      - name: package-comments
        disabled: true
      - name: dot-imports
        severity: warning
      - name: error-naming
        severity: warning
      - name: error-strings
        severity: warning
      - name: error-return
        severity: warning
      - name: var-naming
        disabled: true # Allow "common" and "utils" package names
      - name: exported
        severity: warning

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - whyNoLint          # Already checked via nolintlint
      - wrapperFunc        # Sometimes interferes
      - ifElseChain        # Sometimes conflicts with UI logic

  nolintlint:
    # Require a comment explaining why the linter is disabled?
    # Example: //nolint:gocyclo // complexity is needed here
    require-explanation: false # false for now, but Staff would set to true
    require-specific: true     # Bans plain //nolint, requires //nolint:gocyclo

  gosec:
    # Exclude G104 (duplicates errcheck)
    excludes:
      - G104

issues:
  exclude-dirs:
    - vendor
  exclude-rules:
    - source: "TestCalculateImageStats"
      linters:
        - gocyclo
        - errcheck
        - dupl
        - funlen
        - goconst
        - gosec     # Security is less critical in tests (hardcoded credentials ok)
        - noctx     # Context is often not needed in tests
        - gocognit  # Tests can have higher complexity

run:
  timeout: 5m
