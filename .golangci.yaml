version: "2"

linters:
  disable-all: true
  enable:
    # --- 1. Critical Bugs & Correctness (Must Have) ---
    - govet
    - errcheck
    - staticcheck  # includes gosimple
    - bodyclose
    - nilerr        # [SENIOR] Возврат nil, когда есть ошибка
    - noctx         # [SENIOR] HTTP запросы без контекста (причина утечек памяти)
    - gosec         # [SENIOR] Базовая безопасность

    # --- 2. Clean Code & Dead Code ---
    - unused
    - ineffassign
    - unconvert     # [SENIOR] Убирает лишние конвертации типов (int(x))
    - prealloc      # [SENIOR] Оптимизация аллокаций слайсов

    # --- 3. Style ---
    - misspell
    - revive        # [SENIOR] Замена golint. Идиоматичный Go.

    # --- 4. Complexity & Architecture ---
    - gocyclo
    - gocognit
    - funlen
    - nestif
    - goconst

    # --- 5. Linter Hygiene (Meta-Linting) ---
    - nolintlint    # [SENIOR] Заставляет чистить старые //nolint

    # --- 6. The "Opinionated" Reviewer ---
    - gocritic      # [SENIOR] Находит неочевидные баги и стилистические огрехи

linters-settings:
  # Настройки сложности (оставляем ваши мягкие настройки для легаси)
  funlen:
    lines: 110
    statements: 60

  gocyclo:
    min-complexity: 35

  gocognit:
    min-complexity: 30

  nestif:
    min-complexity: 5

  goconst:
    min-len: 3
    min-occurrences: 3

  # [SENIOR SETTINGS]
  revive:
    rules:
      - name: exported
        disabled: true # Отключаем требование комментов ко всему экспортируемому (часто шумно для UI)
      - name: package-comments
        disabled: true
      - name: dot-imports
        severity: warning
      - name: error-naming
        severity: warning
      - name: error-strings
        severity: warning
      - name: error-return
        severity: warning
      - name: var-naming
        severity: warning

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - whyNoLint          # Уже проверяем через nolintlint
      - wrapperFunc        # Иногда мешает
      - ifElseChain        # Конфликтует иногда с логикой UI

  nolintlint:
    # Требовать комментарий, объясняющий причину отключения линтера?
    # Пример: //nolint:gocyclo // complexity is needed here
    require-explanation: false # Пока false для старта, но Staff поставил бы true
    require-specific: true     # Запрещает просто //nolint, требует //nolint:gocyclo

  gosec:
    # Исключаем G104 (дублирует errcheck)
    excludes:
      - G104

issues:
  exclude-dirs:
    - vendor
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - funlen
        - goconst
        - gosec     # В тестах безопасность не так критична (hardcoded credentials ok)
        - noctx     # В тестах часто контекст не нужен

run:
  timeout: 5m
