linters:
  disable-all: true
  enable:
    # --- 1. Базовые (находят реальные ошибки и мертвый код) ---
    - govet       # Стандартный анализ Go
    - errcheck    # Проверка обработки ошибок
    - staticcheck # Огромный набор проверок, стандарт индустрии
    - gosimple    # Предлагает упрощение кода
    - unused      # Находит неиспользуемые переменные/функции (замена varcheck/deadcode)
    - ineffassign # Находит бесполезные присваивания
    - typecheck   # Проверка типов (как компилятор)
    - bodyclose   # Проверка закрытия body в HTTP ответах

    # --- 2. Форматирование (легко исправить автоматом) ---
    - gofmt
    - goimports
    - misspell    # Опечатки в словах

    # --- 3. Сложность (настройки ниже расслаблены для старта) ---
    - gocyclo     # Цикломатическая сложность
    - gocognit    # Когнитивная сложность (понятность кода)
    - funlen      # Длина функций
    - nestif      # Вложенность if
    - goconst     # Повторяющиеся строки

linters-settings:
  # Настройки сложности взяты "помягче" (из второго файла),
  # чтобы не блокировать работу сразу.

  funlen:
    # Лимит строк в функции.
    # В первом файле было 80, во втором 110. Берем 110 для мягкого старта.
    lines: 110
    # Лимит инструкций (операций).
    statements: 60

  gocyclo:
    # Стандарт 10-15. Вы ставили 35. Оставляем 35, чтобы не переписывать полпроекта.
    min-complexity: 35

  gocognit:
    # Чуть строже, чем cyclo, так как ловит запутанную логику.
    min-complexity: 30 # Увеличил с 20 до 30 для старта.

  nestif:
    # Максимальная вложенность if.
    min-complexity: 5 # Увеличил с 4 до 5 (чуть мягче).

  goconst:
    min-len: 3          # Минимальная длина строки для проверки
    min-occurrences: 3  # Сколько раз строка должна повториться, чтобы ругаться

issues:
  # Исключаем проверки для тестов и сгенерированного кода
  exclude-dirs:
    - vendor
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - funlen
        - goconst

# Лимиты выполнения, чтобы линтер не висел вечно на большом проекте
run:
  timeout: 5m
